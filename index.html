<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/png" href="/favicon-subqi.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fontopsy | Font Inspector & Layers Tester</title>
    <script>
      (function() {
        try {
          var h = window.location.hostname.toLowerCase();
          var p = new URLSearchParams(window.location.search).get('brand');
          var isBombas = h.indexOf('bombastype') !== -1 || p === 'bombastype';
          var fav = isBombas ? '/favicon-bombastype.png' : '/favicon-subqi.png';
          var brandName = isBombas ? 'Bombastype' : 'Subqi Studio';
          document.title = 'Fontopsy • Font Inspector & Layers Tester by ' + brandName;
          var link = document.getElementById('app-favicon') || document.querySelector("link[rel*='icon']");
          if (link) {
            link.type = 'image/png';
            link.href = fav;
          }
        } catch(e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-cyan-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
